{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/v1/admin
            pathType: Prefix
            backend:
              service:
                {{- if and $.Values.ragflow.api.service.enabled $.Values.ragflow.admin.enabled }}
                name: {{ $.Release.Name }}-admin
                port:
                  number: {{ $.Values.ragflow.admin.port }}
                {{- else }}
                name: {{ include "ragflow.fullname" $ }}
                port:
                  name: http
                {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                {{- if $.Values.ragflow.api.service.enabled }}
                name: {{ $.Release.Name }}-api
                port:
                  number: 80
                {{- else }}
                name: {{ include "ragflow.fullname" $ }}
                port:
                  name: http
                {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ragflow.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
