apiVersion: v1
kind: Service
metadata:
  name: ragflow-nodeport
  namespace: ragflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ragflow
    app.kubernetes.io/instance: ragflow
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080  # 30000-32767 범위에서 원하는 포트로 변경 가능
